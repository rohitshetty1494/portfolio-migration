name: Migrate Webflow assets

# Downloads everything the pages still load from Webflow's CDNs into docs/assets/wf,
# rewrites the pages to use the local copies, and commits the result to this branch.
on:
  workflow_dispatch:
  push:
    branches: [migrate/webflow-assets]
    paths:
      - tools/migrate_webflow_assets.py
      - .github/workflows/migrate-webflow.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and rewrite
        run: python tools/migrate_webflow_assets.py docs
      - name: Show report
        run: head -50 tools/migration-report.txt
      - name: Commit result
        run: |
          git config user.name "Rohit Shetty"
          git config user.email "rohitshetty1494@gmail.com"
          git add -A docs tools
          git diff --cached --quiet || git commit -m "Self-host Webflow CDN assets (docs/assets/wf)"
          git push
